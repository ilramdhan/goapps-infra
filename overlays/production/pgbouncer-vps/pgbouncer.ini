; Server-connection budget (production, VPS max_connections=200):
;   per pgbouncer replica = sum(max_db_connections) = 74; x2 replicas = 148
;   + migrate/seed jobs (owner roles, limit 5 each) + backup_ro 4 + monitor 3 + admins
;   must stay < max_connections - superuser_reserved_connections. Re-check if replicas change.
; PgBouncer config for the production VPS PostgreSQL (192.168.0.40). Keep in sync with base template.
[databases]
iam_db = host=192.168.0.40 port=5432 dbname=iam_db pool_size=12 reserve_pool=3 max_db_connections=15
finance_db = host=192.168.0.40 port=5432 dbname=finance_db pool_size=45 reserve_pool=3 max_db_connections=48
ppc_db = host=192.168.0.40 port=5432 dbname=ppc_db pool_size=8 reserve_pool=3 max_db_connections=11

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 0   ; per-DB reserve_pool set in [databases]
max_prepared_statements = 200
server_tls_sslmode = require
client_tls_sslmode = disable
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
log_connections = 1
log_disconnections = 1
stats_period = 60
admin_users = monitor
stats_users = monitor
