# RabbitMQ StatefulSet for GoApps
# Message queue for async processing with persistent storage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: database
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            - containerPort: 15692
              name: metrics
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18    # 15 + (10*18) = 195s max startup time
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 30
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 30
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            # Phase C calc-engine topology, loaded via load_definitions in
            # the mounted rabbitmq.conf. See cost-queues-configmap.yaml.
            - name: cost-definitions
              mountPath: /etc/rabbitmq/definitions
            - name: cost-conf
              mountPath: /etc/rabbitmq/conf.d/20-cost-definitions.conf
              subPath: rabbitmq.conf
            # Prometheus metrics: pinned plugin set + per-object queue metrics
            # (see prometheus-configmap.yaml)
            - name: prometheus-conf
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: prometheus-conf
              mountPath: /etc/rabbitmq/conf.d/30-prometheus.conf
              subPath: 30-prometheus.conf
      volumes:
        - name: cost-definitions
          configMap:
            name: rabbitmq-cost-definitions
            items:
              - key: definitions.json
                path: definitions.json
        - name: cost-conf
          configMap:
            name: rabbitmq-cost-definitions
            items:
              - key: rabbitmq.conf
                path: rabbitmq.conf
        - name: prometheus-conf
          configMap:
            name: rabbitmq-prometheus-conf
  # Persistent storage to prevent data loss on restart
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: database
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
    - port: 15692
      targetPort: 15692
      name: metrics
  selector:
    app: rabbitmq
