# PgBouncer for the VPS PostgreSQL. Configured by MOUNTED files (not env vars):
# the edoburu entrypoint only generates pgbouncer.ini when the file is absent,
# so mounting it skips env-based generation. No DB_* env vars are set, so the
# entrypoint also does not touch userlist.txt (it only `touch`es it if missing).
# Container runs as postgres (uid/gid 70); fsGroup 70 makes the Secret readable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-vps
  namespace: database
  labels:
    app: pgbouncer-vps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer-vps
  template:
    metadata:
      labels:
        app: pgbouncer-vps
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.1-p0
          ports:
            - containerPort: 5432
              name: pgbouncer
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: pgbouncer-vps-config
            defaultMode: 0444
        - name: userlist
          secret:
            # Created manually (never in Git): see docs/db-v2-cutover.md
            secretName: pgbouncer-vps-userlist
            defaultMode: 0440
