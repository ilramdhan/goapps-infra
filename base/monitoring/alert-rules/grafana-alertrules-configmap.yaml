# ============================================================================
# Legacy Alert Rules Cleanup - Auto-provisioned by Grafana Sidecar
#
# This ConfigMap previously defined 5 alert rules (pod-crash-alert,
# pod-high-cpu-alert, pod-restart-alert, hpa-maxed-alert,
# deployment-unavailable-alert) that DUPLICATED rules already provisioned by
# complete-alerts.yaml (pod-crash, pod-high-cpu, pod-high-restarts,
# hpa-at-max, deployment-unavailable), causing double alert emails.
#
# It now carries `deleteRules` entries so Grafana removes the previously
# provisioned duplicates from its database. Once both environments have
# picked this up (check Alerting > Alert rules in Grafana), this file can be
# deleted entirely along with its kustomization entry.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  alert-rules.yaml: |
    apiVersion: 1
    deleteRules:
      - orgId: 1
        uid: pod-crash-alert
      - orgId: 1
        uid: pod-high-cpu-alert
      - orgId: 1
        uid: pod-restart-alert
      - orgId: 1
        uid: hpa-maxed-alert
      - orgId: 1
        uid: deployment-unavailable-alert
      # Uids from the never-wired grafana-alert-rules.yaml (raw provisioning
      # file, not in kustomization). Deleting a non-existent uid is a no-op,
      # so these are safe either way and clean up any manual one-off apply.
      - orgId: 1
        uid: node-not-ready-alert
      - orgId: 1
        uid: node-high-cpu-alert
      - orgId: 1
        uid: node-high-memory-alert
      - orgId: 1
        uid: node-disk-pressure-alert
      - orgId: 1
        uid: pod-high-memory-alert
      - orgId: 1
        uid: ingress-latency-alert
      - orgId: 1
        uid: pvc-almost-full-alert
      - orgId: 1
        uid: pvc-critical-alert
      - orgId: 1
        uid: service-down-alert
