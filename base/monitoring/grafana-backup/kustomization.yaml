apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Grafana sqlite backup.
#
# DELIBERATELY a standalone base, NOT wired into base/backup/cronjobs/.
# That kustomization sets `namespace: database`, and both backup overlays
# re-pin `namespace: database` on top. Every object here must stay in
# `monitoring`, because `pods/exec` is namespaced and the Role granting it can
# only bind within the namespace holding the Grafana pod. See rbac.yaml for the
# full reasoning, including the verified fact that kustomize's namespace
# transformer rewrites RoleBinding SUBJECT namespaces and would silently
# mis-target a cross-namespace binding.
#
# No `namespace:` field is set below on purpose: the manifests already carry
# `namespace: monitoring` explicitly, and adding a transformer here would only
# create another way for an overlay to move them by accident.

resources:
  - rbac.yaml
  - configmap.yaml
  - cronjob.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: goapps-backup
