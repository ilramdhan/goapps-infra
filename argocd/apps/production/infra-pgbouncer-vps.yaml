# ArgoCD Application - PgBouncer for VPS PostgreSQL (Production)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-pgbouncer-vps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: goapps
  source:
    repoURL: https://github.com/mutugading/goapps-infra.git
    targetRevision: main
    path: overlays/production/pgbouncer-vps
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
