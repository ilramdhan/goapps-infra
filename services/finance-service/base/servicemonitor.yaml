apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finance-service
  labels:
    app: finance-service
spec:
  selector:
    matchLabels:
      app: finance-service
  namespaceSelector:
    any: true
  endpoints:
    # `http` (8080), not `metrics`: the finance gateway serves /metrics on the
    # same port as the API, so service.yaml has no separate `metrics` port.
    - port: http
      interval: 30s
      path: /metrics
