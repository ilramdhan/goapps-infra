apiVersion: v1
kind: Service
metadata:
  name: finance-service
  labels:
    app: finance-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    # /metrics is served by the HTTP gateway on this same port (see
    # services/finance/internal/delivery/httpdelivery/gateway.go), so there is
    # no separate `metrics` ServicePort — nothing ever listened on 8090.
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: finance-service
