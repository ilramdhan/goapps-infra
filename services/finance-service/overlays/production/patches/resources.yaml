# Production: Higher resource limits for costing workload (12K products × 500 params).
# Selling calc loads heavy SellingSnapshots JSON per chunk — needs ≥2Gi to avoid OOM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
spec:
  template:
    spec:
      containers:
        - name: finance-service
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
