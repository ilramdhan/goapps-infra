apiVersion: v1
kind: Service
metadata:
  name: iam-service
  labels:
    app: iam-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    # /metrics is served by the HTTP gateway on this same port (see
    # services/iam/internal/delivery/httpdelivery/gateway.go), so there is no
    # separate `metrics` ServicePort — nothing ever listened on 8091.
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app: iam-service
