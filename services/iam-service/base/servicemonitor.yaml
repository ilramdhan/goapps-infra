apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iam-service
  labels:
    app: iam-service
spec:
  selector:
    matchLabels:
      app: iam-service
  namespaceSelector:
    any: true
  endpoints:
    # `http` (8081), not `metrics`: the IAM gateway serves /metrics on the same
    # port as the API, so service.yaml has no separate `metrics` port.
    - port: http
      interval: 30s
      path: /metrics
