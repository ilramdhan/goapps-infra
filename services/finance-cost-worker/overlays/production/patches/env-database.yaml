# Per-environment database endpoint for production.
# Values here are IDENTICAL to base/deployment.yaml today: this file exists so the
# production endpoint can be changed WITHOUT touching the other environment.
#
# Credentials (DATABASE_USER / DATABASE_PASSWORD) stay in base/, sourced from
# the postgres-secret Secret. Never put credentials in this file.
#
# The env vars above the DATABASE block are restated verbatim from base/ ONLY to
# preserve the rendered env-list ordering (strategic merge appends unmatched
# entries), keeping `kustomize build` byte-identical. This patch is listed FIRST
# in kustomization.yaml for the same reason.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-cost-worker
spec:
  template:
    spec:
      containers:
        - name: finance-cost-worker
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOMAXPROCS
              value: "2"
            - name: WORKER_PREFETCH
              value: "1"
            - name: DATABASE_HOST
              value: "pgbouncer.database.svc.cluster.local"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: "goapps"
            - name: DATABASE_SSLMODE
              value: "disable"
