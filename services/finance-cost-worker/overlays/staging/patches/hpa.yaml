# Staging fan-out cap — the 4c/8GB VPS. (Previous value was 6, under a comment
# that claimed 10; neither was node-checked.)
#
# Staging gets a SMALLER share of its node than production, not an equal one:
# the database + monitoring stacks are nearly the same absolute size on both
# hosts, so on a half-size node they eat a proportionally larger fixed cost.
#   production allots 7 x 768Mi = 5376Mi of a 16384Mi node = 32.8%
#   staging at 4 x 512Mi        = 2048Mi of an  8192Mi node = 25.0%
# The old 6 x 512Mi = 3072Mi was 37.5% — more aggressive than production.
#
# Throughput is not a staging goal; correctness verification is.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finance-cost-worker-hpa
spec:
  minReplicas: 2
  maxReplicas: 4
