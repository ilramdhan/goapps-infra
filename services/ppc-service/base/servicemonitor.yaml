apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ppc-service
  labels:
    app: ppc-service
spec:
  selector:
    matchLabels:
      app: ppc-service
  namespaceSelector:
    any: true
  endpoints:
    # `http` (8082), not `metrics`: the PPC gateway serves /metrics on the same
    # port as the API, so service.yaml has no separate `metrics` ServicePort.
    - port: http
      interval: 30s
      path: /metrics
