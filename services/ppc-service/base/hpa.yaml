# Modest CPU-based HPA. PPC Phase-1 is a single API with in-process tickers
# (ETL / machine-sync / auto-approve / efficiency-snapshot). Those tickers are
# NOT leader-elected — running >1 replica duplicates ETL/watermark work and
# racing writes. Design §9: "No HPA scale-out needed Phase-1". Therefore the
# HPA is pinned at 1/1 (present for shape parity with finance; raise maxReplicas
# only after tickers are externalized to a leader-elected worker).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ppc-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ppc-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
