apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: createdb-job.yaml, migrate-job.yaml and seed-job.yaml are intentionally
# NOT listed here — like finance-service, they are one-off Jobs applied
# out-of-band (manually / via a setup script), not synced by ArgoCD.
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml
  - servicemonitor.yaml

commonLabels:
  app.kubernetes.io/name: ppc-service
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: goapps
