apiVersion: v1
kind: Service
metadata:
  name: ppc-service
  labels:
    app: ppc-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
    - name: http
      port: 8082
      targetPort: 8082
    - name: metrics
      port: 8082
      targetPort: 8082
  selector:
    app: ppc-service
