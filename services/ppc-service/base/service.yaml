apiVersion: v1
kind: Service
metadata:
  name: ppc-service
  labels:
    app: ppc-service
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
    # /metrics is served by the HTTP gateway on this same port (as for finance
    # and iam), so there is no separate `metrics` ServicePort — a second entry
    # on 8082 would make the Service unappliable (Kubernetes enforces
    # uniqueness on protocol+port, not name).
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app: ppc-service
