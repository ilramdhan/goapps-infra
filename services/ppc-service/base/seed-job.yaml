# PPC Seeder Job
# Seeds master reference data (overrun thresholds, downtime reasons, waste
# categories, machine groups) into ppc_db. Mirrors finance-service seed-job.
#
# ⚠️ REQUIRES a backend change: services/ppc/Dockerfile currently builds only
#    /app/ppc-service + /app/migrate. It must also build the seeder
#    (seeds/main.go) into /app/ppc-seed for this Job to run — mirror the
#    finance Dockerfile's finance-seed build stage. Until then, seeding must be
#    done manually (`go run seeds/main.go` with PPC_DATABASE_* env pointed at
#    the cluster DB). Tracked as an owed backend task in the STATE ledger.
#
# ORDER: run AFTER ppc-createdb and ppc-migrate.
#
# MANUAL USAGE:
#   kubectl delete job ppc-seed -n <namespace> --ignore-not-found
#   cat seed-job.yaml | sed "s|IMAGE_TAG|<tag>|" | kubectl apply -n <namespace> -f -
#   kubectl logs -f job/ppc-seed -n <namespace>
#
# NOTE: The seeder checks existence before insert, safe to run multiple times.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: ppc-seed
  labels:
    app: ppc-service
    component: seeder
    app.kubernetes.io/name: ppc-service
    app.kubernetes.io/component: seeder
    app.kubernetes.io/part-of: goapps
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ppc-service
        component: seeder
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Never
      containers:
        - name: ppc-seeder
          image: ghcr.io/mutugading/ppc-service:IMAGE_TAG
          imagePullPolicy: Always
          command: ["/app/ppc-seed"]
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PPC_DATABASE_HOST
              value: "postgres.database.svc.cluster.local"
            - name: PPC_DATABASE_PORT
              value: "5432"
            - name: PPC_DATABASE_NAME
              value: "ppc_db"
            - name: PPC_DATABASE_SSLMODE
              value: "disable"
            - name: PPC_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PPC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
