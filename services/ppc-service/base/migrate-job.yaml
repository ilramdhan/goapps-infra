# PPC Migration Job
# Runs database migrations using golang-migrate against the dedicated ppc_db
# database. Mirrors finance-service/base/migrate-job.yaml.
#
# ORDER: run ppc-createdb FIRST (creates ppc_db), then ppc-migrate, then ppc-seed.
#
# MANUAL USAGE:
#   Replace <namespace> and IMAGE_TAG before applying.
#   kubectl delete job ppc-migrate -n <namespace> --ignore-not-found
#   cat migrate-job.yaml | sed "s|IMAGE_TAG|<tag>|" | kubectl apply -n <namespace> -f -
#   kubectl logs -f job/ppc-migrate -n <namespace>
#
# NOTE: Migrations use IF NOT EXISTS / IF EXISTS, safe to run multiple times.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: ppc-migrate
  labels:
    app: ppc-service
    component: migration
    app.kubernetes.io/name: ppc-service
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: goapps
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: ppc-service
        component: migration
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Never
      containers:
        - name: ppc-migrate
          image: ghcr.io/mutugading/ppc-service:IMAGE_TAG
          imagePullPolicy: Always
          command:
            - /app/migrate
            - -path
            - /app/migrations
            - -database
            - $(DATABASE_URL)
            - up
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@postgres.database.svc.cluster.local:5432/ppc_db?sslmode=disable&x-migrations-table=schema_migrations_ppc"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
