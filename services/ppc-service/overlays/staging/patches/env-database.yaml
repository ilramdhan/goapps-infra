# Per-environment database endpoint for staging.
# Values here are IDENTICAL to base/deployment.yaml today: this file exists so the
# staging endpoint can be changed WITHOUT touching the other environment.
#
# Credentials (PPC_DATABASE_USER / PPC_DATABASE_PASSWORD) stay in base/, sourced from
# the postgres-secret Secret. Never put credentials in this file.
#
# The env vars above the DATABASE block are restated verbatim from base/ ONLY to
# preserve the rendered env-list ordering (strategic merge appends unmatched
# entries), keeping `kustomize build` byte-identical. This patch is listed FIRST
# in kustomization.yaml for the same reason.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppc-service
spec:
  template:
    spec:
      containers:
        - name: ppc-service
          env:
            - name: APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PPC_DATABASE_HOST
              value: "postgres.database.svc.cluster.local"
            - name: PPC_DATABASE_PORT
              value: "5432"
            - name: PPC_DATABASE_NAME
              value: "ppc_db"
            - name: PPC_DATABASE_SSLMODE
              value: "disable"
